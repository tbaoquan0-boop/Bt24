<main class="wrap">
<h1>Đăng ký tài khoản</h1>
<p class="lead">Mật khẩu tối thiểu 8 ký tự, có chữ hoa, chữ thường và số.</p>
<form id="register-form" class="card form" novalidate>
  <div class="field">
    <label for="name">Tên</label>
    <input type="text" id="name" name="name" autocomplete="name" maxlength="80">
    <p class="error" role="alert"></p>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email" maxlength="120">
    <p class="error" role="alert"></p>
  </div>
  <div class="field">
    <label for="password">Mật khẩu</label>
    <input type="password" id="password" name="password" autocomplete="new-password" maxlength="128">
    <p class="error" role="alert"></p>
  </div>
  <div class="field">
    <div class="check">
      <input type="checkbox" id="agree" name="agree">
      <label for="agree">Đồng ý điều khoản</label>
    </div>
    <p class="error" role="alert"></p>
  </div>
  <button type="submit">Đăng ký</button>
  <div id="form-result" role="status" hidden></div>
</form>
</main>
<footer class="site">Đề thi kết thúc học phần - Chương 6: Domain Name &amp; Hosting</footer>
